<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guts &amp; Blackpowder - UntilBeef</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f0f11;
            color: #e4e4e7;
            line-height: 1.7;
            padding: 24px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* 头部导航 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #27272a;
        }

        .back-link {
            color: #a1a1aa;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .back-link:hover { color: #fafafa; }

        .header-title {
            font-size: 20px;
            font-weight: 600;
            color: #fafafa;
        }

        /* 主标题 */
        .hero {
            text-align: center;
            margin-bottom: 48px;
        }

        .hero h1 {
            font-size: 28px;
            font-weight: 700;
            color: #fafafa;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 15px;
            color: #a1a1aa;
        }

        /* 条目 */
        .entry {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            transition: border-color 0.2s ease;
        }

        .entry:hover { border-color: #3f3f46; }

        .entry-title {
            font-size: 18px;
            font-weight: 600;
            color: #fafafa;
            margin-bottom: 14px;
        }

        .entry-desc {
            font-size: 14px;
            color: #a1a1aa;
            margin-bottom: 16px;
        }

        .entry-video {
            width: 100%;
            border-radius: 10px;
            border: 1px solid #27272a;
            background-color: #1f1f23;
        }

        /* 页脚 */
        .footer {
            text-align: center;
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid #27272a;
            font-size: 13px;
            color: #52525b;
        }

        .footer a {
            color: #a1a1aa;
            text-decoration: none;
        }

        .footer a:hover { color: #fafafa; }

        @media (max-width: 600px) {
            .hero h1 { font-size: 24px; }
            .entry { padding: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <a href="index.html" class="back-link">← 返回主页</a>
            <span class="header-title">UntilBeef</span>
        </div>

        <!-- 主标题 -->
        <div class="hero">
            <h1>Guts &amp; Blackpowder</h1>
            <p>Guts &amp; Blackpowder 游戏实况与剪辑</p>
        </div>

        <!-- 条目 -->
        <div class="entry">
            <h2 class="entry-title">老牧师对抗18码神罚</h2>
            <p class="entry-desc">使用牧师获得圣彼得堡成就，这一定是老牧师了</p>
            <video src="GB playvlog/老牧师对抗18码神罚.mp4" controls class="entry-video"></video>
        </div>

        <!-- 页脚 -->
        <div class="footer">
            <p>Made by <a href="index.html">UntilBeef</a></p>
        </div>
    </div>
</body>
</html>
