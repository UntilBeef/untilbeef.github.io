<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockTales 粉丝游戏开发日志 - UntilBeef</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f0f11;
            color: #e4e4e7;
            line-height: 1.7;
            padding: 24px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* 头部导航 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #27272a;
        }

        .back-link {
            color: #a1a1aa;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .back-link:hover { color: #fafafa; }

        .header-title {
            font-size: 20px;
            font-weight: 600;
            color: #fafafa;
        }

        /* 主标题 */
        .hero {
            text-align: center;
            margin-bottom: 48px;
        }

        .hero h1 {
            font-size: 28px;
            font-weight: 700;
            color: #fafafa;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 15px;
            color: #a1a1aa;
        }

        /* 日志条目 */
        .log-entry {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            transition: border-color 0.2s ease;
        }

        .log-entry:hover { border-color: #3f3f46; }

        .log-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .log-number {
            background-color: #22c55e;
            color: #0f0f11;
            font-size: 14px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .log-title {
            font-size: 18px;
            font-weight: 600;
            color: #fafafa;
        }

        .log-desc {
            font-size: 14px;
            color: #a1a1aa;
            margin-bottom: 16px;
        }

        .log-video {
            width: 100%;
            border-radius: 10px;
            border: 1px solid #27272a;
            background-color: #1f1f23;
        }

        /* 空状态提示 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 16px;
            color: #71717a;
        }

        .empty-state p {
            font-size: 15px;
        }

        /* 页脚 */
        .footer {
            text-align: center;
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid #27272a;
            font-size: 13px;
            color: #52525b;
        }

        .footer a {
            color: #a1a1aa;
            text-decoration: none;
        }

        .footer a:hover { color: #fafafa; }

        @media (max-width: 600px) {
            .hero h1 { font-size: 24px; }
            .log-entry { padding: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <a href="index.html" class="back-link">← 返回主页</a>
            <span class="header-title">UntilBeef</span>
        </div>

        <!-- 主标题 -->
        <div class="hero">
            <h1>BlockTales 粉丝游戏开发日志</h1>
            <p>记录一个 BlockTales 粉丝游戏的诞生过程。从零开始。</p>
        </div>

        <!-- 日志条目会在这里动态展示 -->

            </div>
            <p class="log-desc">2024-01-15 · 第一次动手，先把项目结构理清楚...</p>
            <video src="BlockTalesFansGameDevLog/1.mp4" controls class="log-video"></video>
        </div>
        -->

        <!-- 日志 #1 -->
        <div class="log-entry">
            <div class="log-header">
                <span class="log-number">#1</span>
                <h2 class="log-title">开发日志 01</h2>
            </div>
            <p class="log-desc">制作了房间名称显示摄像机系统，移动系统，几个动画</p>
            <video src="BlockTalesFansGameDevLog/1.mp4" controls class="log-video"></video>
        </div>

	<!-- 日志 #2 -->
        <div class="log-entry">
            <div class="log-header">
                <span class="log-number">#2</span>
                <h2 class="log-title">开发日志 02</h2>
            </div>
            <p class="log-desc">制作了对话系统和1个NPC</p>
            <video src="BlockTalesFansGameDevLog/2.mp4" controls class="log-video"></video>
        </div>

        <!-- 页脚 -->
        <div class="footer">
            <p>Made by <a href="index.html">UntilBeef</a> · BlockTales 粉丝游戏开发进行中</p>
        </div>
    </div>
</body>
</html>
