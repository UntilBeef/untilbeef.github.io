<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UntilBeef - INeedToBeef</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* 全局重置与基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0f0f11;
            color: #e4e4e7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            line-height: 1.6;
        }

        /* 主卡片容器 */
        .card {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55);
        }

        /* 头像区域 */
        .avatar-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 24px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #27272a;
            transition: border-color 0.3s ease;
        }

        .card:hover .avatar {
            border-color: #3f3f46;
        }

        /* 在线指示点 */
        .status-dot {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 18px;
            height: 18px;
            background-color: #22c55e;
            border: 3px solid #18181b;
            border-radius: 50%;
        }

        /* 标题与别名 */
        .name {
            font-size: 28px;
            font-weight: 600;
            color: #fafafa;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .alias {
            font-size: 15px;
            color: #a1a1aa;
            margin-bottom: 20px;
        }

        /* 分隔线 */
        .divider {
            width: 40px;
            height: 2px;
            background-color: #3f3f46;
            margin: 0 auto 20px auto;
            border-radius: 2px;
        }

        /* 简介 */
        .bio {
            font-size: 15px;
            color: #d4d4d8;
            margin-bottom: 28px;
        }

        /* 社交链接按钮 */
        .social-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #27272a;
            color: #e4e4e7;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .social-link:hover {
            background-color: #3f3f46;
            color: #ffffff;
        }

        .social-link svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* 页脚 */
        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #52525b;
        }

        /* 工具展示区域 */
        .tools {
            margin-bottom: 28px;
            text-align: left;
        }

        .tool-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            background-color: #1f1f23;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 12px 14px;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .tool-item:hover {
            background-color: #27272a;
            border-color: #3f3f46;
        }

        .tool-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .tool-text {
            font-size: 14px;
            color: #d4d4d8;
            line-height: 1.5;
        }

        /* 工具总结 */
        .tool-summary {
            font-size: 15px;
            font-weight: 600;
            color: #22c55e;
            margin-top: 6px;
            text-align: center;
        }

        /* 响应式微调 */
        @media (max-width: 480px) {
            .card {
                padding: 36px 24px;
            }

            .name {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <!-- 头像与状态指示 -->
        <div class="avatar-wrapper">
            <img src="UntilBeef.jpg" alt="UntilBeef 头像" class="avatar">
            <span class="status-dot" title="Online"></span>
        </div>

        <!-- 名字与别名 -->
        <h1 class="name">INeedToBeef</h1>
        <p class="alias">别名 UntilBeef</p>

        <div class="divider"></div>

        <!-- 个人简介 -->
        <p class="bio">
            Roblox 开发者 & 玩家<br>
            大卫你牛大了 我恨你
        </p>

        <!-- 工具展示 -->
        <div class="tools">
            <div class="tool-item">
                <img src="froststrap.png" alt="Froststrap" class="tool-icon">
                <span class="tool-text">Froststrap 有很多原版没有的功能</span>
            </div>
            <div class="tool-item">
                <img src="RobloxPlayer.ico" alt="Roblox Player" class="tool-icon">
                <span class="tool-text">Roblox Player 乐乐。</span>
            </div>
            <p class="tool-summary">所以 Froststrap 牛逼</p>
        </div>

        <!-- Bilibili 链接 -->
        <a class="social-link" href="https://space.bilibili.com/3546854264408363" target="_blank" rel="noopener noreferrer">
            <!-- Bilibili 图标 -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.813 4.653h.854c1.51.054 2.769.578 3.773 1.574 1.004.995 1.524 2.249 1.56 3.76v7.36c-.036 1.51-.556 2.769-1.56 3.773s-2.262 1.524-3.773 1.56H5.333c-1.51-.036-2.769-.556-3.773-1.56S.036 18.858 0 17.347v-7.36c.036-1.511.556-2.765 1.56-3.76 1.004-.996 2.262-1.52 3.773-1.574h.774l-1.174-1.12a1.234 1.234 0 0 1-.373-.906c0-.356.124-.658.373-.907l.027-.027c.267-.249.573-.373.92-.373.347 0 .653.124.92.373L9.653 4.44c.071.071.134.142.187.213h4.267a.836.836 0 0 1 .16-.213l2.853-2.747c.267-.249.573-.373.92-.373.347 0 .662.151.929.4.267.249.391.551.391.907 0 .355-.124.657-.373.906zM5.333 7.24c-.746.018-1.373.276-1.88.773-.506.498-.769 1.13-.786 1.894v7.52c.017.764.28 1.395.786 1.893.507.498 1.134.756 1.88.773h13.334c.746-.017 1.373-.275 1.88-.773.506-.498.769-1.129.786-1.893v-7.52c-.017-.765-.28-1.396-.786-1.894-.507-.497-1.134-.755-1.88-.773zM8 11.107c.373 0 .684.124.933.373.25.249.383.569.4.96v1.173c-.017.391-.15.711-.4.96-.249.25-.56.374-.933.374s-.684-.125-.933-.374c-.25-.249-.383-.569-.4-.96V12.44c0-.373.129-.689.386-.947.258-.257.574-.386.947-.386zm8 0c.373 0 .684.124.933.373.25.249.383.569.4.96v1.173c-.017.391-.15.711-.4.96-.249.25-.56.374-.933.374s-.684-.125-.933-.374c-.25-.249-.383-.569-.4-.96V12.44c.017-.391.15-.711.4-.96.249-.249.56-.373.933-.373z"/>
            </svg>
            Bilibili 主页
        </a>

        <footer class="footer">
            © UntilBeef
        </footer>
    </main>
</body>
</html>
