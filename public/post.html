<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帖子详情 - UntilBeef</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0a0a0c; color: #e4e4e7; line-height: 1.6; min-height: 100vh; }
        .navbar { background-color: rgba(20,20,22,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid #27272a; position: sticky; top: 0; z-index: 100; }
        .navbar-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .nav-brand { font-size: 18px; font-weight: 600; color: #fafafa; text-decoration: none; letter-spacing: -0.3px; }
        .nav-links { display: flex; gap: 24px; list-style: none; }
        .nav-links a { color: #a1a1aa; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s ease; }
        .nav-links a:hover { color: #fafafa; }
        .nav-right { display: flex; align-items: center; gap: 12px; }
        .btn { display: inline-flex; align-items: center; gap: 6px; background-color: #27272a; color: #e4e4e7; border: 1px solid #3f3f46; padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; text-decoration: none; font-family: inherit; }
        .btn:hover { background-color: #3f3f46; }
        .btn-primary { background-color: #22c55e; border-color: #22c55e; color: #0f0f11; }
        .btn-primary:hover { background-color: #16a34a; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .user-menu { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid #3f3f46; }
        .container { max-width: 800px; margin: 0 auto; padding: 24px; }
        .card { background-color: #18181b; border: 1px solid #27272a; border-radius: 16px; padding: 28px; margin-bottom: 16px; }
        .post-header { margin-bottom: 16px; }
        .post-title { font-size: 22px; font-weight: 600; color: #fafafa; line-height: 1.4; margin-bottom: 10px; }
        .post-meta { display: flex; align-items: center; gap: 16px; font-size: 13px; color: #71717a; flex-wrap: wrap; margin-bottom: 20px; }
        .post-meta span { display: flex; align-items: center; gap: 4px; }
        .post-pill { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; }
        .pill-pinned { background-color: #22c55e20; color: #22c55e; }
        .pill-tool { background-color: #3b82f620; color: #60a5fa; }
        .pill-game { background-color: #a855f720; color: #c084fc; }
        .pill-dev { background-color: #f59e0b20; color: #fbbf24; }
        .post-body { font-size: 15px; color: #d4d4d8; line-height: 1.7; white-space: pre-wrap; margin-bottom: 20px; }
        .tool-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 10px 12px; background-color: #1f1f23; border-radius: 10px; }
        .tool-row img { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; }
        .tool-row span { font-size: 13px; color: #d4d4d8; }
        .post-footer { display: flex; align-items: center; gap: 16px; padding-top: 16px; border-top: 1px solid #27272a; }
        .post-action { display: flex; align-items: center; gap: 4px; font-size: 14px; color: #71717a; cursor: pointer; transition: color 0.2s ease; user-select: none; background: none; border: none; font-family: inherit; }
        .post-action:hover { color: #a1a1aa; }
        .post-action.liked { color: #22c55e; }
        .post-action svg { width: 18px; height: 18px; }
        .author-card { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding: 14px; background-color: #1f1f23; border-radius: 12px; }
        .author-card img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid #27272a; }
        .author-name { font-size: 14px; font-weight: 600; color: #fafafa; }
        .author-bio { font-size: 12px; color: #a1a1aa; }
        .comment-section { margin-top: 8px; }
        .comment-count { font-size: 16px; font-weight: 600; color: #fafafa; margin-bottom: 16px; }
        .comment-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
        .comment-item { display: flex; gap: 12px; }
        .comment-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid #27272a; flex-shrink: 0; }
        .comment-body { flex: 1; }
        .comment-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .comment-author { font-size: 13px; font-weight: 600; color: #fafafa; }
        .comment-time { font-size: 12px; color: #71717a; }
        .comment-text { font-size: 14px; color: #d4d4d8; line-height: 1.5; }
        .comment-form { display: flex; gap: 12px; margin-bottom: 20px; }
        .comment-form textarea {
            flex: 1; background-color: #27272a; border: 1px solid #3f3f46; border-radius: 12px;
            padding: 12px 14px; color: #e4e4e7; font-size: 14px; font-family: inherit; outline: none;
            resize: vertical; min-height: 80px;
        }
        .comment-form textarea:focus { border-color: #52525b; }
        .comment-form button { align-self: flex-end; }
        .login-hint { text-align: center; padding: 20px; color: #71717a; font-size: 14px; }
        .login-hint a { color: #22c55e; cursor: pointer; }
        .footer { max-width: 800px; margin: 0 auto; padding: 24px; text-align: center; font-size: 12px; color: #52525b; border-top: 1px solid #27272a; margin-top: 8px; }
        .toast { position: fixed; top: 72px; right: 24px; background-color: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 14px 20px; font-size: 14px; color: #e4e4e7; z-index: 250; transform: translateX(120%); transition: transform 0.3s ease; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
        .toast.show { transform: translateX(0); }
        .toast.error { border-color: #ef444440; color: #fca5a5; }
        .toast.success { border-color: #22c55e40; color: #86efac; }
        .skeleton { background: linear-gradient(90deg, #27272a 25%, #3f3f46 50%, #27272a 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 8px; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        @media (max-width: 640px) { .container { padding: 16px; } .post-title { font-size: 18px; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="nav-brand">UntilBeef</a>
            <ul class="nav-links">
                <li><a href="/">首页</a></li>
                <li><a href="/">帖子列表</a></li>
            </ul>
            <div class="nav-right" id="authArea">
                <button class="btn btn-sm" onclick="location.href='/'">返回首页</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="postContainer">
            <div class="card">
                <div class="skeleton" style="height:28px;width:70%;margin-bottom:16px;"></div>
                <div class="skeleton" style="height:14px;width:40%;margin-bottom:20px;"></div>
                <div class="skeleton" style="height:120px;width:100%;"></div>
            </div>
        </div>

        <div class="card comment-section">
            <div class="comment-count">评论</div>
            <div id="commentFormArea"></div>
            <div class="comment-list" id="commentList"></div>
        </div>
    </div>

    <footer class="footer">&copy; UntilBeef &middot; 论坛 + 博客</footer>

    <div class="toast" id="toast"></div>

    <script>
        const API = '';
        const postId = new URLSearchParams(location.search).get('id');
        if (!postId) location.href = '/';

        function getToken() { return localStorage.getItem('token'); }
        function getUser() { try { return JSON.parse(localStorage.getItem('user')); } catch { return null; } }
        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
        function formatNum(n) { return n >= 1000 ? (n/1000).toFixed(1)+'k' : n; }
        function showToast(msg, type='success') {
            const t = document.getElementById('toast');
            t.textContent = msg; t.className = 'toast ' + type + ' show';
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function renderAuth() {
            const user = getUser();
            const area = document.getElementById('authArea');
            if (user) {
                area.innerHTML = `
                    <div class="user-menu">
                        <img src="${user.avatar || '/assets/UntilBeef.jpg'}" class="user-avatar" alt="${user.username}">
                        <span style="font-size:13px;color:#e4e4e7;">${user.username}</span>
                        <button class="btn btn-sm" onclick="logout()">退出</button>
                    </div>
                    <button class="btn btn-sm" onclick="location.href='/'">返回首页</button>
                `;
            } else {
                area.innerHTML = `
                    <button class="btn btn-sm" onclick="location.href='/'">返回首页</button>
                `;
            }
        }
        async function logout() { localStorage.clear(); location.reload(); }

        async function loadPost() {
            try {
                const res = await fetch(`${API}/api/posts/${postId}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                renderPost(data.post);
                renderComments(data.comments);
                renderCommentForm();
            } catch (err) {
                document.getElementById('postContainer').innerHTML = `<div class="card" style="text-align:center;color:#ef4444;padding:40px;">${err.message || '加载失败'}</div>`;
            }
        }

        function renderPost(post) {
            const pillClass = post.category === 'pinned' ? 'pill-pinned' : post.category === 'tool' ? 'pill-tool' : post.category === 'game' ? 'pill-game' : post.category === 'dev' ? 'pill-dev' : '';
            const pillText = post.category === 'pinned' ? '置顶' : post.category === 'tool' ? '工具' : post.category === 'game' ? '游戏' : post.category === 'dev' ? '开发' : '综合';
            const user = getUser();
            const liked = user && post.likedBy && post.likedBy.includes(user.id);
            const dateStr = new Date(post.createdAt).toLocaleDateString('zh-CN');
            const tagsStr = (post.tags || []).map(t => `<span style="color:#a1a1aa;">#${escapeHtml(t)}</span>`).join(' ');

            let contentHtml = escapeHtml(post.content).replace(/\n/g, '<br>');
            contentHtml = contentHtml.replace(/\[\s*(froststrap\.png|RobloxPlayer\.ico)\s*\]\s*(.+?)(?=<br>|$)/gi, (match, img, text) => {
                const src = img.toLowerCase().includes('froststrap') ? '/assets/froststrap.png' : '/RobloxPlayer.ico';
                return `<div class="tool-row"><img src="${src}" alt="${text.trim()}"><span>${text.trim()}</span></div>`;
            });

            document.getElementById('postContainer').innerHTML = `
                <div class="card">
                    <div class="post-meta">
                        <span class="post-pill ${pillClass}">${pillText}</span>
                        <span>📅 ${dateStr}</span>
                        <span>${tagsStr}</span>
                        <span style="display:flex;align-items:center;gap:4px;">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                            ${formatNum(post.views || 0)}
                        </span>
                    </div>
                    <h1 class="post-title">${escapeHtml(post.title)}</h1>
                    <div class="post-body">${contentHtml}</div>
                    <div class="post-footer">
                        <button class="post-action ${liked ? 'liked' : ''}" onclick="toggleLike(this)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2h0a3.13 3.13 0 0 1 3 3.88Z"/></svg>
                            <span class="like-count">${post.likes || 0}</span>
                        </button>
                        <span class="post-action" onclick="showToast('分享链接已复制','success');navigator.clipboard?.writeText(location.href);">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
                            分享
                        </span>
                    </div>
                    <div class="author-card">
                        <img src="${post.author?.avatar || '/assets/UntilBeef.jpg'}" alt="${post.author?.username}">
                        <div>
                            <div class="author-name">${escapeHtml(post.author?.username || '未知用户')}</div>
                            <div class="author-bio">Roblox 开发者 & 玩家</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCommentForm() {
            const area = document.getElementById('commentFormArea');
            if (getToken()) {
                area.innerHTML = `
                    <div class="comment-form">
                        <textarea id="commentInput" placeholder="写下你的评论..."></textarea>
                        <button class="btn btn-primary" onclick="submitComment()">发表评论</button>
                    </div>
                `;
            } else {
                area.innerHTML = `<div class="login-hint">请 <a onclick="location.href='/'">登录</a> 后发表评论</div>`;
            }
        }

        function renderComments(comments) {
            const list = document.getElementById('commentList');
            if (comments.length === 0) {
                list.innerHTML = '<p style="color:#71717a;text-align:center;padding:20px;">暂无评论，来抢沙发吧</p>';
                return;
            }
            list.innerHTML = comments.map(c => `
                <div class="comment-item">
                    <img src="${c.author?.avatar || '/assets/UntilBeef.jpg'}" class="comment-avatar" alt="${c.author?.username}">
                    <div class="comment-body">
                        <div class="comment-header">
                            <span class="comment-author">${escapeHtml(c.author?.username || '未知用户')}</span>
                            <span class="comment-time">${new Date(c.createdAt).toLocaleString('zh-CN')}</span>
                        </div>
                        <div class="comment-text">${escapeHtml(c.content)}</div>
                    </div>
                </div>
            `).join('');
            document.querySelector('.comment-count').textContent = `评论 (${comments.length})`;
        }

        async function toggleLike(btn) {
            if (!getToken()) { showToast('请先登录', 'error'); return; }
            try {
                const res = await fetch(`${API}/api/posts/${postId}/like`, {
                    method: 'POST', headers: { 'Authorization': 'Bearer ' + getToken() }
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                btn.classList.toggle('liked', data.liked);
                btn.querySelector('.like-count').textContent = data.likes;
                showToast(data.liked ? '点赞成功' : '取消点赞', 'success');
            } catch (err) { showToast(err.message, 'error'); }
        }

        async function submitComment() {
            const content = document.getElementById('commentInput').value.trim();
            if (!content) { showToast('评论内容不能为空', 'error'); return; }
            try {
                const res = await fetch(`${API}/api/posts/${postId}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
                    body: JSON.stringify({ content })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                document.getElementById('commentInput').value = '';
                showToast('评论成功', 'success');
                loadPost();
            } catch (err) { showToast(err.message, 'error'); }
        }

        renderAuth();
        loadPost();
    </script>
</body>
</html>
